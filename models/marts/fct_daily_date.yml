version: 2

models:
  - name: stg_exchange_rates
    description: "Cast + renamed view of raw_exchange_rates. Grain = one row per (rate_date, base_currency, quote_currency)."
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: base_currency
        data_tests: [not_null]
      - name: quote_currency
        data_tests: [not_null]
      - name: exchange_rate
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - rate_date
            - base_currency
            - quote_currency
  - name: fct_daily_date
    description: Daily FX rates with trading-day moving averages, 30d volatility, running high/low, 1-day % change, a rebased-to-100 index, and 7d/30d/YTD % change.
    columns:
      - name: exchange_rate
        data_tests: [not_null]
      - name: ma_7d
        description: 7 trading-day simple moving average.
      - name: volatility_30d
        description: 30 trading-day rolling sample std dev. NULL until 2+ rows exist in the window.
      - name: rate_indexed
        description: Rebased index = 100 at each pair's first trading day (fixed baseline). Lets all pairs be compared on one axis despite different scales.
      - name: pct_change_7d
        description: "% change vs 7 trading days prior. NULL for the first 7 rows per pair."
      - name: pct_change_30d
        description: "% change vs 30 trading days prior. NULL for the first 30 rows per pair."
      - name: pct_change_ytd
        description: "% change since the first trading day of the calendar year."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - rate_date
            - base_currency
            - quote_currency